name: Test

# Installs Orca with setup-orca on each channel and runs it, and builds the image without pushing it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  setup-orca:
    name: setup-orca (${{ matrix.channel }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        channel: [minimum, latest]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: orca
        uses: ./setup-orca
        with:
          channel: ${{ matrix.channel }}
          plugin-manifest: test/fixtures/orca-plugin.json
      - run: xvfb-run -a "$ORCA_APP/resources/bin/orca-ide" --version | grep -F "$VERSION"
        env:
          ORCA_APP: ${{ steps.orca.outputs.app }}
          VERSION: ${{ steps.orca.outputs.version }}

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(gh release view --repo stablyai/orca --json tagName --jq '.tagName | ltrimstr("v")')
          docker build --build-arg ORCA_VERSION="$version" --file image/Containerfile --tag orca:test .
          docker run --rm orca:test sh -c 'xvfb-run -a "$ORCA_APP/resources/bin/orca-ide" --version' | grep -F "$version"
