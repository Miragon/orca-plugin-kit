version: 2
updates:
  # The actions this repository's workflows and its own composite actions use.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"

  # The image's Node base. A new Node major changes the image for every consumer, so it is a
  # breaking change of this kit and is left for a human.
  - package-ecosystem: "docker"
    directories:
      - "/images/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
